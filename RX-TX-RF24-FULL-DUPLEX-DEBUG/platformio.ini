; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = DEBUG-FULL-A, DEBUG-FULL-B

[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = nrf24/RF24@^1.6.2
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:DEBUG-FULL-A]
; Placa A: inicia os pedidos e recebe as respostas de B.
; Cada ambiente compila seu programa e as definicoes compartilhadas.
build_src_filter = -<*> +<DEBUG-FULL-A.cpp> +<RX-TX-common.cpp>
upload_flags = -V
upload_port = /dev/cu.usbserial-120

[env:DEBUG-FULL-B]
; Placa B: recebe os pedidos de A e transmite as respostas.
build_src_filter = -<*> +<DEBUG-FULL-B.cpp> +<RX-TX-common.cpp>
upload_flags = -V
upload_port = /dev/cu.usbserial-130

